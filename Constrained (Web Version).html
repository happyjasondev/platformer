			        fill(0, 80, 255);
			        rect(this.x, this.y, this.width, this.height, 5);
			        fill(0, 0, 0);
			        ellipse(this.x + 6, this.y + 6, 6.5, 6.5);
			        ellipse(this.x + 19, this.y + 6, 6.5, 6.5);
			    };
			    this.die = function() {
			        this.x = this.spawnX;
			        this.y = this.spawnY;
			        this.xv = 0;
			        this.yv = 0;
			    };
			    this.collision = function(xv, yv) {
			        if (this.x < 0) {
			            this.xv = 0;
			            this.x = 0;
			        } else if (this.x > width - this.width) {
			            this.xv = 0;
			            this.x = width - this.width;
			        }
			        if (this.y < 0) {
			            this.yv = 0;
			            this.y = 0;
			            this.canJump = false;
			        } else if (this.y > 450) {
			            this.die();
			        }
			        for (var i = 0; i < blocks.length; i++) {
			            if (collideObject(this, blocks[i])) {
			                if (xv < 0) {
			                    this.xv = 0;
			                    this.x = blocks[i].x + blocks[i].width;
			                } else if (xv > 0) {
			                    this.xv = 0;
			                    this.x = blocks[i].x - this.width;
			                }
			                if (yv < 0) {
			                    this.yv = 0;
			                    this.y = blocks[i].y + blocks[i].height;
			                    this.canJump = false;
			                } else if (yv > 0) {
			                    this.yv = 0;
			                    this.y = blocks[i].y - this.height;
			                    this.canJump = true;
			                }
			            }
			        }
			        for (var i = 0; i < acid.length; i++) {
			            if (collideObject(this, acid[i])) {
			                this.die();
			            }
			        }
			        for (var i = 0; i < spikes.length; i++) {
			            if (collideObject(this, spikes[i])) {
			                this.die();
			            }
			        }
			        for (var i = 0; i < bullets.length; i++) {
			            if (collideObject(this, bullets[i])) {
			                bullets.splice(i, 1);
			                this.die();
			            }
			        }
			        for (var i = 0; i < turrets.length; i++) {
			            if (collideObject(this, turrets[i])) {
			                if (xv < 0) {
			                    this.xv = 0;
			                    this.x = turrets[i].x + turrets[i].width;
			                } else if (xv > 0) {
			                    this.xv = 0;
			                    this.x = turrets[i].x - this.width;
			                }
			                if (yv < 0) {
			                    this.yv = 0;
			                    this.y = turrets[i].y + turrets[i].height;
			                    this.canJump = false;
			                } else if (yv > 0) {
			                    this.yv = 0;
			                    this.y = turrets[i].y - this.height;
			                    this.canJump = true;
			                }
			            }
			        }
			        for (var i = 0; i < jumpers.length; i++) {
			            if (collideObject(this, jumpers[i])) {
			                if (xv < 0) {
			                    this.xv = 0;
			                    this.x = jumpers[i].x + jumpers[i].width;
			                } else if (xv > 0) {
			                    this.xv = 0;
			                    this.x = jumpers[i].x - this.width;
			                }
			                if (yv < 0) {
			                    this.yv = 0;
			                    this.y = jumpers[i].y + jumpers[i].height;
			                    this.canJump = false;
			                } else if (yv > 0) {
			                    this.yv = -3.5;
			                    this.y = jumpers[i].y - this.height;
			                    this.canJump = true;

			            }
			        }
			    };
			    this.move = function() {

			        if (!((keys[LEFT] || keys[65]) || (keys[RIGHT] || keys[68])) || ((keys[LEFT] || keys[65]) && (keys[RIGHT] || keys[68]))) {
			            this.xv = 0;
			        }
			        this.x += this.xv;
			        this.collision(this.xv, 0);
			        if ((keys[UP] || keys[87]) && this.canJump) {
			            this.yv -= this.jumpHeight;
			        }
			        this.yv += this.gravity;
			        if (this.yv > this.fallSpeed) {
			            this.yv = this.fallSpeed;
			        }
			        this.canJump = false;        
			        this.y += this.yv;
			        this.collision(0, this.yv);
			    };

			player = new Player(0, 0);
			var Block = function(x, y) {
			    this.x = x;

			    this.width = 25;

			    this.draw = function() {

			        fill(50, 50, 50);
			        rect(this.x, this.y, this.width, this.height);
			        fill(0, 0, 0);
			        triangle(this.x, this.y, this.x, this.y + this.height, this.x + this.width/2, this.y + this.height/2);
			        fill(100, 100, 100);
			        triangle(this.x + this.width, this.y, this.x + this.width, this.y + this.height, this.x + this.width/2, this.y + this.height/2);
			        destroyBullet(this);
			    };
			};
			var Acid = function(x, y) {
			    this.x = x;
			    this.y = y;
			    this.width = 25;
			    this.height = 25;
			    this.draw = function() {
			        noStroke();
			        fill(0, 55 * sin(frameCount * 2) + 200, 0);
			        rect(this.x, this.y, this.width, this.height);
			        destroyBullet(this);
			    };
			};
			var Spike = function(x, y) {
			    this.x = x;
			    this.y = y;
			    this.width = 25;
			    this.height = 25;
			    this.draw = function() {
			        noStroke();
			        fill(125, 125, 125);
			        triangle(this.x + this.width/2, this.y, this.x, this.y + this.height, this.x + this.width, this.y + this.height);
			        fill(175, 175, 175);
			        triangle(this.x + this.width/2, this.y, this.x + this.width/2, this.y + this.height, this.x + this.width, this.y + this.height);
			        destroyBullet(this);
			    };
			};
			var Bullet = function(x, y, smart) {
			    this.x = x;
			    this.y = y;
			    this.width = 5;
			    this.height = 5;
			    this.smart = smart;
			    this.speed = 2;
			    this.angle = atan2((player.y + player.height/2) - this.y, (player.x + player.width/2) - this.x);
			    this.draw = function() {
			        if (this.smart) {
			            this.angle = atan2((player.y + player.height/2) - this.y, (player.x + player.width/2) - this.x);
			            this.speed = 1.5;
			        }
			        this.x += this.speed * cos(this.angle);
			        this.y += this.speed * sin(this.angle);
			        noStroke();
			        if (this.smart && frameCount % 10 === 0) {
			            fill(255, 0, 0);
			        } else {
			            fill(0, 0, 0);
			        }
			        ellipse(this.x, this.y, this.width, this.height);
			    };
			};
			var Turret = function(x, y, smart) {
			    this.x = x;
			    this.y = y;
			    this.width = 25;
			    this.height = 25;
			    this.smart = smart;
			    this.draw = function() {
			        this.angle = atan2(player.y - this.y, player.x - this.x);
			        this.barrelX = this.x + this.width/2 + cos(this.angle) * 10;
			        this.barrelY = this.y + this.height/2 + sin(this.angle) * 10;
			        noStroke();
			        fill(200, 200, 0);
			        rect(this.x, this.y, this.width, this.height);
			        fill(150, 150, 0);
			        triangle(this.x, this.y, this.x, this.y + this.height, this.x + this.width/2, this.y + this.height/2);
			        fill(250, 250, 0);
			        triangle(this.x + this.width, this.y, this.x + this.width, this.y + this.height, this.x + this.width/2, this.y + this.height/2);
			        if (this.smart) {
			            fill(255, 0, 0);
			        } else {
			            fill(125, 125, 125);            
			        }
			        ellipse(this.x + this.width/2, this.y + this.height/2, 10, 10);
			        if (this.smart) {
			            stroke(255, 0, 0);
			        } else {
			            stroke(125, 125, 125);
			        }
			        strokeWeight(5);
			        line(this.x + this.width/2, this.y + this.height/2, this.barrelX, this.barrelY);
			        if (frameCount % 200 === 0) {
			            bullets.push(new Bullet(this.barrelX, this.barrelY, this.smart));
			        }
			    };
			};
			var Jumper = function(x, y) {
			    this.x = x;
			    this.y = y;
			    this.width = 25;
			    this.height = 25;
			    this.draw = function() {

			        fill(255, 50, 50);
			        rect(this.x, this.y, this.width, this.height/2);
			        fill(255, 0, 0);
			        triangle(this.x, this.y, this.x, this.y + this.height/2, this.x + this.width/2, this.y + this.height/4);
			        fill(255, 100, 100);
			        triangle(this.x + this.width, this.y, this.x + this.width, this.y + this.height/2, this.x + this.width/2, this.y + this.height/4);
			        stroke(0, 0, 0);
			        strokeWeight(1);
			        line(this.x, this.y + this.height/2, this.x + this.width, this.y + this.height);
			        line(this.x + this.width, this.y + this.height/2, this.x, this.y + this.height);
			        destroyBullet(this);
			    };
			};
			var Door = function(x, y) {
			    this.x = x;
			    this.y = y;

			        rect(this.x, this.y, this.width, this.height);
			        fill(100, 30, 30);
			        quad(this.x, this.y, this.x, this.y + this.height, this.x + 18, this.y + 21, this.x + 18, this.y + 4);
			        fill(100, 100, 100);
			        ellipse(this.x + this.width/2, this.y + this.height/2, 5, 5);
			        destroyBullet(this);
			    };
			};
			
			createLevel = function() {
			    blocks = [];
			    acid = [];
			    spikes = [];
			    bullets = [];
			    turrets = [];
			    jumpers = [];
			    doors = [];
			    for (var i = 0; i < levels[levelNum].length; i++) {
			        for (var j = 0; j < levels[levelNum][i].length; j++) {
			            var x = j * 25;
			            var y = i * 25;
			            switch (levels[levelNum][i][j]) {
			                case "p":
			                    player.spawnX = x;
			                    player.spawnY = y;
			                    player.x = player.spawnX;
			                    player.y = player.spawnY;
			                break;                
			                case "b":
			                    blocks.push(new Block(x, y));
			                break;
			                case "a":
			                    acid.push(new Acid(x, y));
			                break;
			                case "s":
			                    spikes.push(new Spike(x, y));
			                break;
			                case "t":
			                    turrets.push(new Turret(x, y, false));
			                break;
			                case "T":
			                    turrets.push(new Turret(x, y, true));
			                break;
			                case "j":
			                    jumpers.push(new Jumper(x, y));
			                break;
			                case "d":
			                    doors.push(new Door(x, y));
			                break;
			            }
			        }
			    }
			};
			createLevel();
			var drawObject = function(object) {
			    for (var i = 0; i < object.length; i++) {
			        object[i].draw();
			    }
			};
			
			var walls = function() {
			    background(150, 150, 150);
			    noStroke();
			    fill(200, 200, 200);
			    rect(0, 0, 100, 400);
			    fill(175, 175, 175);
			    quad(0, 0, 0, 25, 100, 50, 400, 0);
			    fill(150, 200, 255);
			    quad(250, 100, 250, 110, 350, 95, 350, 85);
			    fill(255, 255, 255, 30);
			    quad(250, 110, 350, 95, 100, 700, -300, 300);
			};
			
			var Button = function(x, y, txt, next) {
			    this.x = x;
			    this.y = y;
			    this.width = 200;
			    this.height = 50;
			    this.txt = txt;
			    this.next = next;
			    this.brightness = 100;
			    this.radius = 10;
			    this.draw = function() {
			        fill(0, 0, 0, this.brightness);
			        rect(this.x, this.y, this.width, this.height, this.radius);
			        fill(255, 255, 255, this.brightness);
			        textSize(20);
			        text(this.txt, this.x + 100, this.y + 25);
			        if (mouseX >= this.x && mouseX <= this.x + this.width && mouseY >= this.y && mouseY <= this.y + this.height) {
			            cursor("POINTER");
			            this.brightness = 150;
			            this.radius = 20;
			            if (mouseIsPressed) {
			                scene = this.next;
			            }
			        } else {
			            this.brightness = 100;
			            this.radius = 10;
			        }
			    };
			};
			var play = new Button(100, 150, "Play", 3);
			var how = new Button(100, 250, "How", 2);
			var back = new Button(100, 325, "Back", 1);
			
			var title = function() {
			    walls();
			    fill(0, 0, 0);
			    textSize(50);
			    text("C   NSTRAINED", 200, 75);
			    fill(50, 50, 50);
			    rect(50, 55, 40, 40);
			    fill(0, 0, 0);
			    triangle(50, 55, 50, 95, 70, 75);
			    fill(100, 100, 100);
			    triangle(90, 55, 90, 95, 70, 75);
			    play.draw();
			    how.draw();
			};
			var info = function() {
			    walls();
			    fill(0, 0, 0);
			    textSize(15);
			    text("It is a sunny Saturday afternoon. You and your\nfriend are enjoying the afternoon eating donuts and\nplaying video games. Suddenly, the police come to\nyour room and accuse you of stealing donuts\nfrom Winston (you didn't)!\n\nBefore long, you find yourself enclosed in a large\nand dim-lit building. But it seems that the police\nforgot to arrest your friend! With your friend's\nspecial telepathic skills (that's another story), he\nwill guide you during your escape!\n\nFollow your friend's directions in-game.", 200, 150);
			    back.draw();
			};
			var game = function() {
			    walls();
			    fill(0, 0, 0);
			    textSize(20);
			    text(messages[levelNum].text, messages[levelNum].x, messages[levelNum].y);
			    drawObject(blocks);
			    drawObject(turrets);
			    drawObject(bullets);
			    drawObject(jumpers);
			    drawObject(acid);
			    drawObject(spikes);
			    drawObject(doors);
			    player.draw();
			    player.move();
			    if (levelNum === 16) {
			        scene++;
			    }
			};
			var win = function() {
			    background(150, 150, 150);
			    noStroke();
			    fill(255, 255, 255);
			    rect(100, 100, 200, 200);
			    fill(175, 175, 175);
			    rect(0, 300, 400, 100);
			    fill(255, 255, 255, 150);
			    quad(100, 300, 300, 300, 225, 400, 0, 400);
			    fill(0, 0, 0);
			    rect(185, 275, 25, 25, 5);
			    fill(0, 0, 0, 175);
			    quad(185, 300, 210, 300, 125, 400, 100, 400);
			    fill(0, 0, 0);
			    textSize(50);
			    text("You escaped!", 200, 50);
			    textSize(20);
			    text("If you see this screen,\nthen you have a great temper lol", 200, 200);
			};
			
			draw = function() {
			    cursor("DEFAULT");
			    switch (scene) {
			        case 1:
			            title();
			        break;
			        case 2:
			            info();
			        break;
			        case 3:
			            game();
			        break;
			        case 4:
			            win();
			        break;
			    }
			};
			//}
			
		}
		
		runPJS(program);
		
		// Add reload button on KA --> <script>
		
	</script>
</body>
